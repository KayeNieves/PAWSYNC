<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Pets | PawSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout-portal.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="portal-header">
    <div class="container portal-header__inner">
      <a class="brand" href="portal-dashboard.html" aria-label="PawSync home"><img class="brand__mark" src="../Assets/pawsync-mark.png" alt=""><img class="brand__wordmark" src="../Assets/pawsync-text.png" alt=""></a>
      <nav aria-label="Client portal">
        <ul class="portal-nav__list">
          <li><a class="nav__link" href="portal-dashboard.html">Dashboard</a></li>
          <li><a class="nav__link is-active" href="portal-my-pets.html" aria-current="page">My Pets</a></li>
          <li><a class="nav__link" href="portal-book-appointment.html">Book</a></li>
          <li><a class="nav__link" href="portal-my-appointments.html">Appointments</a></li>
        </ul>
      </nav>
      <p class="portal-header__greeting">Hi, Trishia!</p>
    </div>
  </header>

  <main id="main" class="container portal-main">
    <h1 class="page-title">My Pets</h1>
    <p>Your registered pets will appear here.</p>
    <p><a class="btn btn--primary" href="portal-register-pet.html">Register a pet</a></p>
  </main>
  <script src="../js/auth.js"></script>
  <script src="../js/pawsync-storage.js"></script>
  <script>
    (function () {
      var pets = PawSyncData.get('pawsyncPets');
      if (!pets.length) return;
      var main = document.querySelector('main');
      var grid = document.createElement('div');
      grid.className = 'grid grid--2';
      pets.forEach(function (pet) {
        var card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = '<h2 class="card__title">' + PawSyncData.escapeHtml(pet.name) +
          '</h2><p>' + PawSyncData.escapeHtml(pet.species) + ' / ' +
          PawSyncData.escapeHtml(pet.breed) + '</p><p class="text-muted">' +
          PawSyncData.escapeHtml(pet.gender) + ' - ' +
          PawSyncData.escapeHtml(pet.birthday) + '</p>';
        grid.appendChild(card);
      });
      main.appendChild(grid);
    })();
  </script>
</body>
</html>
